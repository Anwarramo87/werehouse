name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend-nest/**'
      - '.github/workflows/backend-ci.yml'
      - 'railway.json'
  pull_request:
    paths:
      - 'backend-nest/**'
      - '.github/workflows/backend-ci.yml'
      - 'railway.json'

defaults:
  run:
    working-directory: backend-nest

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: warehouse_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/warehouse_ci
      JWT_SECRET: ci_test_jwt_secret_min_32_chars_long
      JWT_EXPIRE: 24h
      JWT_COOKIE_NAME: warehouse_access_token
      ADMIN_BOOTSTRAP_PASSWORD: ci_admin_password_123
      DEV_ADMIN_PASSWORD: ci_dev_password_123
      SUPERADMIN_PASSWORD: ci_superadmin_password_123
      QUEUES_ENABLED: 'false'
      CACHE_ENABLED: 'false'
      REDIS_URL: redis://127.0.0.1:6379
      CORS_ORIGIN: http://localhost:3000
      DEVICE_AUTH_ENFORCED: 'false'
      THROTTLE_TTL_MS: '60000'
      THROTTLE_LIMIT: '200'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend-nest/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
